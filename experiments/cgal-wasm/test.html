<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CNC PRO 3D — CGAL WASM test</title>
  <style>
    body{margin:0;background:#17191d;color:#e8e8e8;font:14px system-ui,sans-serif}
    header{padding:14px 18px;background:#242830;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:9px 14px;border:0;border-radius:6px;background:#477bd0;color:white;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}
    #status{padding:10px 18px;color:#b9c9e6;white-space:pre-wrap}
    #view{display:block;width:100%;height:calc(100vh - 112px)}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <header>
    <strong>CGAL 6.2.1 / EPICK / Difference</strong>
    <button id="run">Вычесть тестовый куб</button>
    <span>Контроль: куб 2×2×2 минус пересекающий его куб 1×1×1</span>
  </header>
  <div id="status">Нажми кнопку для проверки WASM-модуля.</div>
  <canvas id="view"></canvas>
  <script type="module" src="./test.js"></script>
</body>
</html>
